name: Weather

# The Kalshi weather paper tick. Started every 15 minutes by the NBA Scheduler (one dispatch step at the end of
# scheduler.yml), or by hand. Own concurrency group; only writes data/wx/ and docs/wx/.
# scripts/wx_tick.py decides what is due: price checks (~32 h before each market closes), settlement of closed
# markets, page publishing, and one phone summary a day from 5:20 PM PT (main rule only). Paper only: never trades.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this tick"
        type: string
        default: manual
      send:
        description: "Allow the daily phone summary"
        type: boolean
        default: true
      force_publish:
        description: "Rebuild the pages now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wx-data
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -q "Jinja2>=3.1,<4"

      - name: Tick
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "Started by: ${{ inputs.source || github.event_name }}"
          python scripts/wx_tick.py ${{ inputs.send != false && '--send' || '' }} ${{ inputs.force_publish == true && '--force-publish' || '' }}

      - name: Save to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wx/ docs/wx/
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -q -m "Weather: tick $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1

      - name: Phone alert if the tick failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS -H "Title: Weather tick FAILED" -H "Tags: warning" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "The weather paper tick failed. Tap to see the details." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
