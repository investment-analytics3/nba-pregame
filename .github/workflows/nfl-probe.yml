name: NFL probe (developer)

# Saves raw NFL source responses (ESPN, Kalshi) to the "dev-nfl-samples" branch
# so the NFL parsers can be built against real data. Does not touch main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/nfl_probe.py
      - name: Save samples to the dev-nfl-samples branch
        run: |
          cd samples/nfl
          git init -q -b dev-nfl-samples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Raw NFL source samples $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-nfl-samples
