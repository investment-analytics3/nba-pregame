name: Pregame board

# Manual runs only: send a preview, or force a board/final (send=false only
# publishes the page). The automatic board and Final are sent by the Scheduler
# (.github/workflows/scheduler.yml), using the same rules in
# scripts/board_decide.py: the board at 12 PM weekdays / 10 AM weekends and the
# Final 90 minutes before the day's first tip, each at most once a day.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What to send"
        type: choice
        options: [preview, board, final, auto]
        default: preview
      send:
        description: "Send the email and phone alert (untick to only publish the page)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nba-data
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is it time to send?
        id: decide
        run: python scripts/board_decide.py --kind "${{ inputs.kind || 'auto' }}"

      - name: Install
        if: steps.decide.outputs.kind != 'none'
        run: pip install -q -r requirements.txt

      - name: Catch up any missing games
        if: steps.decide.outputs.kind != 'none'
        run: python scripts/update_data.py

      - name: Build and score today's slate
        if: steps.decide.outputs.kind != 'none'
        run: python scripts/build_slate.py

      - name: Publish the page, email it, send the phone alert
        if: steps.decide.outputs.kind != 'none'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/run_board.py --kind "${{ steps.decide.outputs.kind }}" ${{ inputs.send == false && '--no-send' || '' }}

      - name: Refresh the Results page
        if: steps.decide.outputs.kind != 'none'
        run: python scripts/update_results.py

      - name: Save to the repo
        if: steps.decide.outputs.kind != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -q -m "Board ${{ steps.decide.outputs.kind }} $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Phone alert if something failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS -H "Title: NBA board run FAILED" -H "Tags: warning" -H "Priority: high" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "The pregame board run failed. Tap to see the details." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
