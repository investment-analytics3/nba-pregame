name: Overnight data update

# Manual runs only. The nightly update itself is run by the Scheduler
# (.github/workflows/scheduler.yml) once a day from 3 AM Pacific, with catch-up
# if a tick is missed. Run this by hand to refresh data at any time; it only
# fetches what is missing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Catch up box scores, metrics and power ranks
        id: update
        run: python scripts/update_data.py

      - name: Grade yesterday's boards and rebuild the Results page
        if: steps.update.outputs.acted == 'true'
        run: python scripts/update_results.py

      - name: Build today's slate (for checking)
        if: steps.update.outputs.acted == 'true'
        run: python scripts/build_slate.py

      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data ] && git add data/ || true
          [ -d docs ] && git add docs/ || true
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -q -m "Data update $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Phone alert if something failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS -H "Title: NBA overnight update FAILED" -H "Tags: warning" -H "Priority: high" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "The 3 AM data update failed. Tap to see the details." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
