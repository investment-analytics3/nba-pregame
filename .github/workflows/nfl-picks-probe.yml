name: NFL picks probe (developer)

# Feasibility test for automating expert pick counts: fetches last week's pick articles,
# robots.txt and guessed next-week addresses, saved to the "dev-nfl-picks" branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/nfl_picks_probe.py
      - name: Save to the dev-nfl-picks branch
        run: |
          cd samples/picks
          git init -q -b dev-nfl-picks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Picks probe $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-nfl-picks
