name: Probe live sources (developer)

# Saves raw ESPN live play-by-play and Kalshi NBA market responses, with their
# CORS headers, to the "dev-live-samples" branch. Does not touch main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_live.py
      - name: Save samples to the dev-live-samples branch
        run: |
          cd samples
          git init -q -b dev-live-samples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live source samples $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-live-samples
