name: NFL checkpoint logger

# Shadow mode: records halftime and end-of-3rd checkpoints (score, favorite's lead,
# real Kalshi price, ESPN win probability) for every game on this week's NFL board.
# No alerts, no bets. Started by the NFL tick while games are on; stops when no game
# is on or about to start, and the next tick restarts it for later kickoffs.
on:
  workflow_dispatch:
    inputs:
      once:
        description: "One poll only (test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nfl-live
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Log checkpoints
        run: python scripts/nfl_live.py --max-minutes 330 ${{ inputs.once == true && '--once' || '' }}
