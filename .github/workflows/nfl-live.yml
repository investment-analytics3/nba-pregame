name: NFL checkpoint logger

# Shadow mode: records halftime, end-of-3rd, 4th 10:00 and 4th 6:00 checkpoints (score, lead,
# real Kalshi price, ESPN win probability, live engine grade) for every game on this week's
# NFL board, and publishes live Kalshi prices for the Live page (nfl-live-data branch).
# Phone alerts: tracked games only, end of 3rd + first bet signal (max two per game).
# No alerts, no bets. Started by the NFL tick while games are on; stops when no game
# is on or about to start, and the next tick restarts it for later kickoffs.
on:
  workflow_dispatch:
    inputs:
      once:
        description: "One poll only (test)"
        type: boolean
        default: false
      send:
        description: "Send phone alerts (tracked games: end of 3rd + first bet signal)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nfl-live
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Log checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/nfl_live.py --max-minutes 330 ${{ inputs.once == true && '--once' || '' }} ${{ inputs.send == false && '--no-alert' || '' }}
