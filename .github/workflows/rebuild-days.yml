name: Rebuild past days

# Rebuilds boards for recent days that were never sent (using only what was
# known before tip-off) and adds them to the Results page as "Rebuilt" rows.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many past days to rebuild"
        default: "3"

permissions:
  contents: write

concurrency:
  group: nba-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest main when the job starts, not when it was queued (Nov 12 fix)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Catch up any missing games
        run: python scripts/update_data.py
      - name: Rebuild and grade
        run: python scripts/rebuild_days.py --days "${{ inputs.days }}"
      - name: Save to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -q -m "Rebuilt past boards $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
