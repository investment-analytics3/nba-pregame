name: logo-check
on:
  push:
    branches: [dev-logo-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          n=0; while read u; do n=$((n+1)); curl -s -o /tmp/f "$u"; echo "B64START $n"; base64 -w0 /tmp/f; echo; echo "B64END $n"; done < urls.txt
