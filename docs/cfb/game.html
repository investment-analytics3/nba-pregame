<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../site.css">
<style>
.grade{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:'Barlow Condensed',Inter,sans-serif;font-size:34px;font-weight:700}
.gA{background:linear-gradient(180deg,#34C77B,#1A8A4C);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}.gB{background:linear-gradient(180deg,#FADB80,#D9A12A);color:#2A1C00}
.gC{background:linear-gradient(180deg,#D44444,#A12222);color:#fff}.gN{background:#1C2438;color:#8B95AB}
.sec{padding:16px 18px;margin-bottom:16px}.sec h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#C7CEDC}
.score{font-family:'Barlow Condensed',Inter,sans-serif;font-size:40px;font-weight:700;line-height:1}
td.win{color:#6EF0A8;font-weight:700}
.sec td:first-child{white-space:normal}
.copy{all:unset;cursor:pointer;font-size:12px;font-weight:600;color:#8FB8F5;margin-left:8px}
.list a.game{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:10px;text-decoration:none;color:var(--text)}
code{font-size:12px;background:#121A2C;padding:6px 8px;border-radius:8px;display:block;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<!-- College Live (L2): grades a game in the browser from ESPN with the football engine (docs/nfl/engine.js).
     Kalshi prices come from the college checkpoint logger (cfb-live-data branch); the logged checkpoint
     prices (end of 1st, halftime, end of 3rd) come from live.json. Prices never change the grade. -->
<div class="wrap" style="padding-bottom:0"><nav class="nav"><a href="../">Home</a><a href="./">College board</a><a class="on" href="game.html">Live</a><a href="live.html">Checkpoint log</a><a href="../nfl/">NFL</a><a href="../nba/">NBA</a></nav></div>
<div class="wrap" id="app" style="padding-top:18px"><div class="muted">Loading…</div></div>
<script src="../nfl/engine.js"></script>
<script>
(function(){
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football';
const PRICES = 'https://raw.githubusercontent.com/investment-analytics3/nba-pregame/cfb-live-data/prices.json';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = document.getElementById('app');
const gid = new URLSearchParams(location.search).get('g');
const get = async (u, bust = true) => { const r = await fetch(bust ? u + (u.includes('?') ? '&' : '?') + 't=' + Date.now() : u); if (!r.ok) throw new Error(r.status); return r.json(); };
const gcls = g => g && g[0] === 'A' ? 'gA' : (g === 'B' ? 'gB' : (g === 'C' ? 'gC' : 'gN'));
let timer = null, ctx = null, ep = null, book = null;

// Tier chip (owner Nov 10): Qualified = live read + phone pushes; Watch list = live read only.
const tierChip = g => g.tier === 'qualified' || (!g.tier && g.tracked) ? '<span class="chip cg">Qualified</span>'
  : (g.tier === 'watch' ? '<span class="chip cy" title="Live read here; no phone pushes">Watch list</span>' : '');

async function list() {
  const sb = await get(`${ESPN}/scoreboard?groups=80&limit=300`).catch(() => ({ events: [] }));
  const st = {}; (sb.events || []).forEach(e => { st[e.id] = e.status; });
  const games = (ctx.games || []).filter(g => g.tracked).slice().sort((a, b) => {
    const r = x => ({ in: 0, pre: 1, post: 2 }[((st[x.id] || {}).type || {}).state] ?? 1);
    return r(a) - r(b) || a.kick_utc.localeCompare(b.kick_utc);
  });
  app.innerHTML = `<div class="eyebrow">College football · Week ${esc(ctx.week)} · live</div><h1 class="title cond">Live games</h1>
    <div class="muted" style="margin:6px 0 18px">Qualified and Watch list games (favorite −10 to −20). Grades run in your browser from ESPN play-by-play with the football live rules. Bets only in the 4th, 15:00–5:00.</div>
    <div class="list">${games.map(g => { const s = st[g.id] || {}, state = (s.type || {}).state;
      return `<a class="panel game" href="?g=${esc(g.id)}"><span><b>${esc(g.away_abbr)} @ ${esc(g.home_abbr)}</b> ${tierChip(g)}<br>
      <span class="muted small">${state === 'in' ? '<span class="chip live"><i></i>' + esc((s.type || {}).shortDetail) + '</span>' : esc(state === 'post' ? 'Final' : g.kick_pt)} · ${g.fav_abbr ? esc(g.fav_abbr) + ' ' + (g.spread ?? '') : 'no line'}</span></span><span class="muted">Open ›</span></a>`; }).join('')}</div>`;
}

async function game() {
  const g = (ctx.games || []).find(x => String(x.id) === gid);
  const [summ, prices] = await Promise.all([get(`${ESPN}/summary?event=${encodeURIComponent(gid)}`), get(PRICES).catch(() => null)]);
  const kal = prices && prices.games && prices.games[gid] ? prices.games[gid].prices : null;
  const c = g ? { fav: g.fav_abbr, dog: g.dog_abbr, fav_defense_top10: g.fav_defense_top10, qbs: g.qbs, ep, kalshi: kal, date: g.day_et } : { ep, kalshi: kal };
  const r = NflEngine.analyze(summ, c);
  const d = r.decision || {};
  const T = r.teams, A = T.away.abbr, H = T.home.abbr;
  let h = `<div class="row" style="flex-wrap:wrap;margin-bottom:14px"><a class="btn chip cn" href="game.html">‹ All games</a><a class="btn chip cn" href="./#g-${esc(gid)}">Pregame page</a>${g ? tierChip(g) : ''}${g ? `<span class="chip cn">Pregame call: ${esc(g.call)}${g.hero != null ? ' · ' + g.hero + '/40' : ''}</span>` : ''}</div>
    <div class="eyebrow">College live · ${esc(r.phase.label)}</div>
    <div class="row between" style="margin:8px 0 18px;flex-wrap:wrap"><div class="score">${esc(A)} ${T.away.score} – ${esc(H)} ${T.home.score}</div><div class="muted">${esc(r.clockLabel)}${r.state === 'in' ? ' · refreshes every 30 s' : ''}</div></div>`;
  if (r.state === 'pre') { app.innerHTML = h + `<div class="panel final">Not started. Kickoff ${esc(g ? g.kick_pt : '')}.</div>`; return; }
  const price = r.price ? `Kalshi ${esc(r.price.abbr)} ${Math.round(r.price.prob * 100)}¢ (${r.price.american > 0 ? '+' : ''}${r.price.american})${r.price.pricedIn ? ' · above 85%: edge mostly priced in' : ''}` : 'No Kalshi price (the logger publishes it while games are on)';
  const fside = r.sides[d.focusSide] || {};
  h += `<div class="panel sec"><div class="row" style="gap:14px"><div class="grade ${gcls(d.grade)}">${esc(d.grade)}</div>
      <div><div class="line">${esc(d.headline)}${d.lock ? ' <span class="chip cg">Lock (who wins, not value)</span>' : ''}</div>
      <div class="small muted">${esc(price)}</div></div></div>
      ${(fside.gates || []).length ? `<div style="margin-top:10px">${fside.gates.map(x => `<div class="flag yellow" style="margin-top:6px">${esc(x)}</div>`).join('')}</div>` : ''}</div>`;
  h += `<div class="panel sec"><h3>1. Who answered the run?</h3><div class="small"><b>${esc(r.whoAnswered || 'NONE')}</b> · ${esc(r.answerNote)}</div>
      <div class="small muted" style="margin-top:8px">Scoring: ${(r.scoring || []).map(e => `${esc(e.at)} ${esc(e.team)} +${e.pts}`).join(' · ') || 'none yet'}</div></div>`;
  h += `<div class="panel sec"><h3>2. Control vs momentum (${esc(r.control.window)})</h3><div class="tw"><table><tr><th></th><th>${esc(A)}</th><th>${esc(H)}</th></tr>
      ${r.control.rows.map(x => `<tr><td>${esc(x.label)}</td><td class="${x.winner === 'away' ? 'win' : ''}">${esc(x.away)}</td><td class="${x.winner === 'home' ? 'win' : ''}">${esc(x.home)}</td></tr>`).join('')}
      <tr><td><b>Control (3 of 5)</b></td><td>${r.control.wins.away}</td><td>${r.control.wins.home}</td></tr>
      <tr><td>Takeaways · 20+ yd plays · def/ST TDs</td><td>${r.momentum.away.takeaways} · ${r.momentum.away.explosive} · ${r.momentum.away.defTD}</td><td>${r.momentum.home.takeaways} · ${r.momentum.home.explosive} · ${r.momentum.home.defTD}</td></tr></table></div>
      <div class="small" style="margin-top:8px">${r.control.team ? `<b>${esc(r.control.team)}</b> has control.` : 'No team has control.'} ${r.fake ? `<span class="warnc">${esc(r.fake.text)}</span>` : ''}</div>
      <div class="tiny">EPA and success are estimated from ESPN play-by-play with nflverse expected points. Pressure = sacks (ESPN has no QB hits).</div></div>`;
  h += `<div class="panel sec"><h3>3. Quarterback (closer)</h3><div class="small">${['away', 'home'].map(s => { const q = r.qb[s]; return `<b>${esc(T[s].abbr)}</b>: ${esc(q.name)} · <b>+${q.score}</b> (${esc(q.why)})${q.unclear ? ' <span class="warnc">status unclear</span>' : ''}`; }).join('<br>')}</div></div>`;
  h += `<div class="panel sec"><h3>4. Risk flags</h3><div class="small">${(r.risk || []).map(esc).join('<br>') || 'None'}</div></div>`;
  h += `<div class="panel sec"><h3>5. What changes it</h3><div class="small">${(r.changes || []).map(esc).join('<br>')}<br><span class="muted">${esc(r.next)}</span></div></div>`;
  const lg = book && book.games ? book.games[gid] : null;
  const cpRow = k => { const x = lg && lg[k]; if (!x) return `<tr><td>${({q1: 'End of 1st', half: 'Halftime', q3: 'End of 3rd'})[k]}</td><td colspan="4" class="muted">not logged yet</td></tr>`;
    const kk = x.kalshi || {}; return `<tr><td>${({q1: 'End of 1st', half: 'Halftime', q3: 'End of 3rd'})[k]}${x.late ? ' <span class="muted">(late)</span>' : ''}</td><td>${esc(x.score)}</td><td>${x.lead > 0 ? '+' : ''}${x.lead}</td><td><b>${kk.prob != null ? Math.round(kk.prob * 100) + '¢' : '–'}</b></td><td>${x.espn_wp != null ? Math.round(x.espn_wp * 100) + '%' : '–'}</td></tr>`; };
  h += `<div class="panel sec"><h3>Checkpoint prices (logged)</h3><div class="tw"><table><tr><th>When</th><th>Score</th><th>Fav lead</th><th>Kalshi fav</th><th>ESPN win %</th></tr>${['q1', 'half', 'q3'].map(cpRow).join('')}</table></div>
      <div class="tiny">Backtest (2022-26, 793 games): fair price ≈ win rate at every checkpoint (end of 1st 10+: won 93%, fair 95¢; halftime 10+: 96%, 97¢; end of 3rd 14+: 99.4%, 99¢). Value only if Kalshi is below fair.</div></div>`;
  h += `<div class="panel sec"><h3>Tracker log line <button class="copy" id="cp">Copy</button></h3><code id="ll">${esc(r.logLine)}</code></div>`;
  app.innerHTML = h;
  const cp = document.getElementById('cp');
  if (cp) cp.onclick = () => navigator.clipboard && navigator.clipboard.writeText(document.getElementById('ll').textContent).then(() => { cp.textContent = 'Copied'; });
  clearTimeout(timer);
  if (r.state === 'in') timer = setTimeout(() => game().catch(show), 30000);
}

const show = e => { app.innerHTML = `<div class="panel final">Couldn't load the game (${esc(e.message)}). Try again in a minute.</div>`; };
Promise.all([get('context.json'), get('../nfl/ep.json', false), get('live.json').catch(() => null)]).then(([c, e, b]) => { ctx = c; ep = e; book = b; return gid ? game() : list(); }).catch(show);
})();
</script>
</body>
</html>
