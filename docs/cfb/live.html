<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Checkpoint Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../site.css">
</head>
<body>
<!-- College football Kalshi price log (owner Nov 10): real Kalshi prices at the end of the 1st, halftime and
     the end of the 3rd for every tracked game, next to the result, to check whether Kalshi ever sells
     these leads below a fair price. Nothing here is a bet signal. -->
<div class="wrap" style="padding-bottom:0"><nav class="nav"><a href="../">Home</a><a href="./">College board</a><a href="game.html">Live</a><a class="on" href="live.html">Checkpoint log</a><a href="../nfl/">NFL</a><a href="../nba/">NBA</a></nav></div>
<div class="wrap" id="app" style="padding-top:18px"><div class="muted">Loading…</div></div>
<script>
(function(){
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const c = p => p == null ? '–' : Math.round(p * 100) + '¢';
const app = document.getElementById('app');
const KIND = {q1: 'End of 1st', half: 'Halftime', q3: 'End of 3rd'};
// Backtest 2022-26 (793 games, favorite -10 to -20): win rate vs fair price (ESPN's in-game win probability)
const BT = {q1: {won: '92.6%', fair: '95¢'}, half: {won: '96.3%', fair: '97¢'}, q3: {won: '98.5%', fair: '98¢'}};

function row(e, kind){
  const r = e[kind]; if (!r) return '';
  const k = r.kalshi || {}, res = e.final ? (e.final.fav_won ? `<span class="okc">${esc(e.fav)} won by ${e.final.fav_margin}</span>` : `<span class="noc">${esc(e.fav)} lost by ${-e.final.fav_margin}</span>`) : '<span class="muted">in progress</span>';
  return `<tr><td>${esc(e.day_et)}</td><td><b>${esc(e.away)} @ ${esc(e.home)}</b><br><span class="muted">${esc(e.fav)} ${e.spread ?? ''} · ${esc(e.tier === 'qualified' ? 'Qualified' : 'Watch list')}</span></td>
    <td>${KIND[kind]}${r.late ? ` <span class="muted">(late, ${esc(r.clock)})</span>` : ''}</td><td>${esc(r.score)}</td><td>${r.lead > 0 ? '+' : ''}${r.lead}</td>
    <td><b>${c(k.prob)}</b>${k.bid != null ? `<br><span class="muted">${c(k.bid)}/${c(k.ask)}</span>` : ''}</td>
    <td>${r.espn_wp != null ? Math.round(r.espn_wp * 100) + '%' : '–'}</td><td>${res}</td></tr>`;
}

fetch('live.json?t=' + Date.now()).then(r => r.ok ? r.json() : {games: {}}).catch(() => ({games: {}})).then(book => {
  const entries = Object.values(book.games || {}).sort((a, b) => (b.day_et || '').localeCompare(a.day_et || ''));
  // summary: fav up 10+ at each checkpoint, finished games with a Kalshi price
  const stat = {};
  for (const kind of ['q1', 'half', 'q3']) {
    const xs = entries.filter(e => e.final && e[kind] && e[kind].lead >= 10 && (e[kind].kalshi || {}).prob != null);
    const won = xs.filter(e => e.final.fav_won).length;
    const avg = xs.length ? xs.reduce((a, e) => a + e[kind].kalshi.prob, 0) / xs.length : null;
    stat[kind] = {n: xs.length, won, avg};
  }
  const tiles = ['q1', 'half', 'q3'].map(k => `<div><b>${stat[k].n ? stat[k].won + '-' + (stat[k].n - stat[k].won) : '–'}</b><span>${KIND[k]}, up 10+ · avg Kalshi ${c(stat[k].avg)}</span></div>`).join('');
  const rows = entries.map(e => ['q1', 'half', 'q3'].map(k => row(e, k)).join('')).join('');
  app.innerHTML = `<div class="eyebrow">College football · ${esc(book.season || '')} · price log</div>
    <h1 class="title cond">Checkpoint Log</h1>
    <div class="muted" style="margin-top:6px">Real Kalshi prices at the end of the 1st, halftime and the end of the 3rd for every tracked game. Updated ${esc(book.updated || 'not yet')}.</div>
    <div class="stat" style="margin:20px 0 22px">${tiles}</div>
    <div class="panel final"><b>What to compare against (backtest 2022-26, favorite up 10+)</b><ul>
      ${['q1', 'half', 'q3'].map(k => `<li>${KIND[k]}: won ${BT[k].won}; fair price about ${BT[k].fair}</li>`).join('')}</ul>
      <div class="small muted" style="margin-top:8px">If Kalshi's average price at a checkpoint sits well below the win rate over a few weekends, that checkpoint has value. Up to now it is only a price log; no bet signal comes from it.</div></div>
    ${rows ? `<div class="panel" style="padding:8px 12px"><div class="tw"><table><tr><th>Date</th><th>Game</th><th>Checkpoint</th><th>Score</th><th>Fav lead</th><th>Kalshi fav</th><th>ESPN win %</th><th>Result</th></tr>${rows}</table></div></div>`
           : '<div class="panel final">No checkpoints logged yet. The first ones come from this week\'s tracked games.</div>'}
    <div class="small muted foot">Kalshi = favorite's market price at the checkpoint (mid of bid/ask; bid/ask below). Read-only: the system never trades.</div>`;
});
})();
</script>
</body>
</html>
