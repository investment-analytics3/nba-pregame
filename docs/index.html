<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<!-- Landing page (L0). Static: each sport's pipeline publishes its own pages and a small
     JSON this page reads (NBA: live/context.json, NFL: nfl/summary.json). -->
<div class="wrap">
  <div class="eyebrow">Moneyline system · pregame and live</div>
  <h1 class="title cond">Game Boards</h1>
  <div class="home-grid">
    <a class="panel sport" href="nba/" id="nba">
      <div class="row between"><h2 class="cond">NBA</h2><span class="chip cn" data-k="date">today</span></div>
      <div class="big" data-k="head">Loading…</div>
      <div class="stat" data-k="stat"></div>
      <div class="small muted" data-k="list"></div>
      <div class="small"><span style="color:#8FB8F5;font-weight:600">Open the NBA board ›</span></div>
    </a>
    <a class="panel sport" href="nfl/" id="nfl">
      <div class="row between"><h2 class="cond">NFL</h2><span class="chip cn" data-k="date">this week</span></div>
      <div class="big" data-k="head">Loading…</div>
      <div class="stat" data-k="stat"></div>
      <div class="small muted" data-k="list"></div>
      <div class="small"><span style="color:#8FB8F5;font-weight:600">Open the NFL board ›</span></div>
    </a>
  </div>
  <div class="small muted" style="margin-top:22px">More: <a href="results.html">NBA results</a> · <a href="live/">NBA live</a> · <a href="nfl/game.html">NFL live</a> · <a href="nfl/live.html">NFL checkpoint log</a></div>
</div>
<script>
(function(){
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const set = (id, k, html) => { const el = document.querySelector(`#${id} [data-k="${k}"]`); if (el) el.innerHTML = html; };
const stat = pairs => pairs.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
const get = async u => { const r = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now()); if (!r.ok) throw new Error(r.status); return r.json(); };

get('live/context.json').then(c => {
  const gs = c.games || [], green = gs.filter(g => g.band === 'green').length;
  const d = new Date(c.date + 'T12:00:00');
  set('nba', 'date', d.toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'}));
  set('nba', 'head', gs.length ? `${gs.length} game${gs.length > 1 ? 's' : ''} tracked` : 'No game passes the six rules today');
  set('nba', 'stat', stat([[gs.length, 'tracked'], [green, 'green']]));
  set('nba', 'list', gs.slice(0, 4).map(g => `${esc(g.spread)} vs ${esc(g.dog)} · ${esc(g.tip_pt)} · score ${g.score}`).join('<br>'));
}).catch(() => set('nba', 'head', 'Board not published yet today'));

get('nfl/summary.json').then(s => {
  set('nfl', 'date', `Week ${esc(s.week ?? '–')}`);
  set('nfl', 'head', s.tracked ? `${s.tracked} game${s.tracked > 1 ? 's' : ''} tracked` : 'No game passes the six rules yet');
  set('nfl', 'stat', stat([[s.upcoming ?? s.games, 'to play'], [s.tracked ?? 0, 'tracked'], [s.edge_clears ?? 0, 'edge clears']]));
  set('nfl', 'list', `Updated ${esc(s.built_label || '')}`);
}).catch(() => set('nfl', 'head', 'NFL board not built yet'));
})();
</script>
</body>
</html>
