<html lang="en">
<head>

<title>Tennis Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0A0F1C;--card1:#172036;--card2:#111829;--line:#1F2A42;--text:#E6EAF2;--muted:#8B95AB;--dim:#7C869E;
--green:#2FC373;--yellow:#E9B23A;--red:#C83030;--amber:#FB923C;--blue:#60A5FA;--orange:#FB923C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:#93C5FD}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 72px}
.cond{font-family:'Barlow Condensed',Inter,sans-serif}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1.title{margin:6px 0 0;font-size:44px;line-height:1;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:16px 0 28px;font-size:12.5px;color:#9AA4BA}
.legend span{display:inline-flex;align-items:center;gap:6px}.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.panel{border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card1),var(--card2));box-shadow:0 12px 30px rgba(0,0,0,.4)}
.final{padding:16px 18px;margin-bottom:26px;border-color:rgba(96,165,250,.45)}
.final h2{margin:0 0 8px;font-size:15px}.final ul{margin:0;padding-left:18px;color:#D3D9E5;font-size:14px;line-height:1.6}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-head h2{margin:0;font-size:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sec-head .cnt{font-size:12px;font-weight:700;color:#C7CEDC;background:#1A2236;border:1px solid #26314B;padding:2px 9px;border-radius:999px}
.sec-head .rule{flex:1;height:1px;background:linear-gradient(90deg,#2A3653,rgba(42,54,83,0))}
.amberline{height:4px;margin:-4px 0 20px;border-radius:999px;background:linear-gradient(90deg,#FADB80,#D9A12A 70%,#8A5F0E);box-shadow:0 0 12px rgba(233,178,58,.45)}
.redline{height:6px;margin:-4px 0 20px;border-radius:999px;background:linear-gradient(90deg,#F05252,#C42B2B 70%,#8E1A1A);box-shadow:0 0 16px rgba(240,82,82,.55)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:20px;margin-bottom:34px}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:18px 18px 14px;cursor:pointer;
border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card1),var(--card2));
box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:#34415F}.card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.tip{font-size:12px;font-weight:700;letter-spacing:.1em;color:#A9B2C6;text-transform:uppercase}
.b2b{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.yn{padding:1px 6px;border-radius:5px;font-size:11px;font-weight:700}
.badge{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#F3F6FB;
box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 8px rgba(0,0,0,.35)}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:5px}
.sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.line{font-size:19px;font-weight:600}
.qual{display:flex;gap:7px;font-size:12.5px;line-height:1.4}
.warn{font-size:12px;line-height:1.4;color:#FDE68A;background:rgba(233,178,58,.12);border:1px solid rgba(233,178,58,.4);border-radius:10px;padding:6px 10px}
.pills{display:flex;flex-direction:column;gap:6px;padding:12px 10px 10px;border-radius:14px;background:rgba(6,10,20,.45);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.prow{display:grid;grid-template-columns:56px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.h2h{display:grid;grid-template-columns:74px repeat(2,minmax(0,1fr)) 14px repeat(2,minmax(0,1fr));gap:6px;align-items:center}
.vs{font-size:9px;font-weight:800;color:#5B6680;text-align:center;letter-spacing:.04em}
.h2h .tm{grid-column:span 2;text-align:center;font-size:11.5px;font-weight:800;color:#DCE2EE;letter-spacing:.04em}
.mx{outline:2.5px solid #F3F6FB;outline-offset:2px;box-shadow:0 0 12px rgba(255,255,255,.55)!important}
.mline{font-size:12px;line-height:1.4;padding:6px 8px 0;border-top:1px solid #1F2A42;margin-top:4px}
.ph{display:flex;flex-direction:column;align-items:center;line-height:1.15}.ph b{font-size:10.5px;color:#C7CEDC}.ph span{font-size:9.5px;color:var(--dim)}
.pl{display:flex;flex-direction:column;line-height:1.1}.pl b{font-size:12px;color:#DCE2EE}.pl span{font-size:10px;color:var(--dim)}
.pill{display:flex;align-items:center;justify-content:center;white-space:nowrap;height:30px;border-radius:9px;font-weight:700;font-size:16px;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
.pg{background:linear-gradient(180deg,#34C77B,#1A8A4C);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.2),0 3px 8px rgba(20,140,75,.35)}
.py{background:linear-gradient(180deg,#FADB80,#D9A12A);color:#2A1C00;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.18),0 3px 8px rgba(200,150,30,.3)}
.pr{background:linear-gradient(180deg,#D44444,#A12222);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.25),0 3px 8px rgba(190,40,40,.35)}
.pd{background:linear-gradient(180deg,#A31818,#650909);color:#fff;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both,pulse 2.4s ease-in-out infinite}
.pn{background:#1C2438;color:var(--dim)}
.more{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#8FB8F5}
.donut{position:relative;flex:none}.donut svg{width:100%;height:100%;overflow:visible}
.donut .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut .num b{font-weight:700;line-height:.9;text-shadow:0 2px 8px rgba(0,0,0,.5)}.donut .num span{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--dim)}
.arc{animation:sweep 1.2s cubic-bezier(.33,1,.68,1) both}
.card-in{animation:cardIn .6s cubic-bezier(.22,1,.36,1) both}
.grow{transform-origin:left center;animation:grow .9s cubic-bezier(.33,1,.68,1) both}
.grow-r{transform-origin:right center;animation:grow .9s cubic-bezier(.33,1,.68,1) both}
.draw{animation:draw 1.1s cubic-bezier(.33,1,.68,1) both}.fade{animation:fade .5s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{from{opacity:0;transform:scale(.55)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,70,70,0)}50%{box-shadow:0 0 0 4px rgba(255,70,70,.28),0 0 16px rgba(255,60,60,.6)}}
@keyframes sweep{from{stroke-dashoffset:289.027}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fade{from{opacity:0}}
@media (max-width:420px){.card .donut{width:88px!important;height:88px!important}.card .donut .num b{font-size:30px!important}h1.title{font-size:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* detail */
.btn{all:unset;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #26314B;background:#151C2E;color:#DCE2EE;font-size:14px;font-weight:600;cursor:pointer}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;margin-bottom:16px;border-radius:14px}
.two{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
.pad{padding:22px}
h3{margin:0 0 4px;font-size:16px;font-weight:700}
.note{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.hm{display:grid;grid-template-columns:96px repeat(2,minmax(0,1fr)) 14px repeat(2,minmax(0,1fr));gap:6px;align-items:center;margin-bottom:6px}
.hm .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;height:48px;border-radius:10px;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px;margin-bottom:20px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;margin-bottom:20px}
.tbl-row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.wl{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800}
.nav{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.nav a{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:#C7CEDC;text-decoration:none}
.nav a.on{background:#1C2640;color:#fff;border:1px solid #2E3B5C}
.sec-title{margin:6px 0 12px;font-size:22px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
/* live */
.tabs{display:inline-flex;padding:4px;border-radius:999px;background:#121A2C;border:1px solid #26314B;gap:4px}
.tabs a{min-height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:#9AA4BA;text-decoration:none}
.tabs a.on{background:linear-gradient(180deg,#2E4170,#1C2845);color:#fff}
.lv:empty{display:none}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:#121A2C;border:1px solid #26314B;color:#DCE2EE;width:fit-content}
.lv .g{padding:0 6px;border-radius:5px;font-size:11px;background:linear-gradient(180deg,#34C77B,#1A8A4C);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}.lv .g.B{background:#FADB80;color:#2A1C00}.lv .g.C{background:#D44444;color:#fff}
.lv-dot:not(:empty),.lv i{width:7px;height:7px;border-radius:50%;background:#F05252;box-shadow:0 0 6px #F05252;display:inline-block;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
</style>
</head>

(function(){

const FORM = {g:'color:#fff;background:linear-gradient(180deg,#34C77B,#1A8A4C);text-shadow:0 1px 1px rgba(0,0,0,.25)',

              r:'color:#fff;background:linear-gradient(180deg,#D44444,#A12222)'};
const flip = c => c==='g' ? 'r' : (c==='r' ? 'g' : c);
const ml = v => v==null ? '–' : (v>0?'+':'−') + Math.abs(v).toLocaleString('en-US');
const cents = p => p==null ? '' : Math.round(p*100)+'¢';

function rankPill(r, isFav){
  const c = r==null ? 'r' : (r<=TOP ? 'g' : (r<=MID ? 'y' : 'r'));
  return `<span class="yn" style="${FORM[isFav?c:flip(c)]}" title="Tennis Abstract Elo rank">${r==null?'NR':'#'+r}</span>`;
}
function formPill(rec, isFav){
  if(!rec) return '<span class="yn" style="color:#C7CEDC;background:#1A2236">–</span>';

  return `<span class="yn" style="${FORM[isFav?c:flip(c)]}">${esc(rec)}</span>`;
}

    <circle cx="60" cy="60" r="46" fill="none" stroke="url(#ringtrack)" stroke-width="13"/>
    <circle cx="60" cy="60" r="38" fill="url(#hub)" stroke="rgba(255,255,255,.05)"/>
    <g transform="rotate(-90 60 60)"><circle class="arc" cx="60" cy="60" r="46" fill="none" stroke="url(#ring${r.band})" stroke-width="13" stroke-linecap="round"
      style="stroke-dasharray:${C};stroke-dashoffset:${off};filter:url(#drop);animation-delay:${delay}ms"/></g></svg>
    <div class="num"><b class="cond" style="font-size:${size*.33}px;color:${b.num}">${r.score}</b><span>/ ${mx}</span></div></div>`;
}
// "ATP Challenger · ATP Challenger Yokohama" -> "ATP Challenger · Yokohama"
const tname = r => (r.tourney||'').startsWith((r.tour||'')+' ') ? r.tourney.slice(r.tour.length+1) : (r.tourney||'');
const initials = n => esc(String(n||'').split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase());
function playerLine(r, p, isFav){
  return `<div class="row">
    <span class="badge cond" style="background:${isFav?'linear-gradient(180deg,#2E4170,#1C2845)':'linear-gradient(180deg,#252E45,#181F31)'}">${initials(p.name)}</span>
    <div style="min-width:0;flex:1"><div class="row" style="gap:6px;flex-wrap:wrap"><span style="font-weight:600;font-size:15px">${esc(p.name)}</span>
      ${isFav?'<span class="tag" style="color:#BFDBFE;background:rgba(96,165,250,.16);border:1px solid rgba(96,165,250,.4)">FAV</span>':''}</div>
      <div class="sub"><span>Elo ${rankPill(p.elo_rank, isFav)} · ${p.rank?'Rank #'+p.rank:'Rank –'} · Form ${formPill(p.form, isFav)}</span></div></div>
    <span style="text-align:right;line-height:1.05"><span class="line cond" style="color:${isFav?'#F3F6FB':'#8B95AB'}">${ml(isFav?r.ml:r.opp_ml)}</span><br><span style="font-size:10.5px;color:var(--dim)">${cents(isFav?r.price:r.opp_price)}</span></span></div>`;
}
const ptsCls = (p,m) => p/m>=.8 ? 'pg' : (p/m>=.4 ? 'py' : 'pr');
function metricGrid(r, base){
  const val = (k,v) => v==null ? '–' : (k==='elo' ? v : (k==='sr' ? Number(v).toFixed(1) : (k==='fat' ? Math.round(v)+'m' : v)));
  let h = `<div class="pills"><div style="display:grid;grid-template-columns:96px minmax(0,1fr) 46px minmax(0,1fr);gap:6px;font-size:10.5px;color:var(--dim);text-align:center"><span></span><span style="font-weight:800;color:#DCE2EE">FAV</span><span>pts</span><span style="font-weight:800;color:#DCE2EE">OPP</span></div>`;
  (r.metrics||[]).forEach((m,i)=>{
    const fv = m.key==='elo' ? (r.fav.elo_rank?Math.round(r.fav.elo):null) : (m.key==='sr' ? r.fav.sr : (m.key==='form' ? r.fav.form : r.fav.load));
    const ov = m.key==='elo' ? (r.opp.elo_rank?Math.round(r.opp.elo):null) : (m.key==='sr' ? r.opp.sr : (m.key==='form' ? r.opp.form : r.opp.load));
    h += `<div style="display:grid;grid-template-columns:96px minmax(0,1fr) 46px minmax(0,1fr);gap:6px;align-items:center" title="${esc(m.note)}">
      <span class="pl"><b>${esc(m.label.replace(' (last 2 events)','').replace(' (7 days)',''))}</b><span>${esc({elo:'Elo rating',sr:'SPW + RPW %',form:'last 2 events',fat:'court time 7d'}[m.key]||'')}</span></span>
      <span class="pill cond ${ptsCls(m.pts,m.max)}" style="font-size:15px;animation-delay:${base+i*70}ms">${esc(val(m.key,fv))}</span>
      <span class="cond" style="text-align:center;font-weight:700;font-size:15px">${m.pts}<span style="font-size:10px;color:var(--dim)">/${m.max}</span></span>
      <span class="pill cond pn" style="font-size:15px;animation-delay:${base+i*70+35}ms">${esc(val(m.key,ov))}</span></div>`;
  });
  return h + `<div class="mline" style="color:#9AA4BA">${esc(r.readout||'')}</div></div>`;
}
function qualLine(r){
  if(r.section==='qualified') return ['#86EFAC','M3 8.5l3.2 3L13 4.5',`Qualified: ${r.tier_label}, Elo #${r.fav.elo_rank} vs ${r.opp.elo_rank?'#'+r.opp.elo_rank:'unrated'}`];
  if(r.section==='short') return ['#FCA5A5','M4 4l8 8M12 4l-8 8','Shorter than -2000: tracked, not qualified'];
  const why = r.tier==='t800' ? '-800 to -1000 (watch tier)' : `${r.tier_label} but ranks miss (needs Elo top ${TOP} vs ${MID+1}+)`;
  return ['#FCD97A','M8 3v6M8 12v.5', why];
}
function card(r, i){
  const delay = i*90, q = qualLine(r);
  const chip = r.section==='watch' ? '<span class="chip" style="color:#2A1C00;background:linear-gradient(180deg,#FADB80,#D9A12A);letter-spacing:.08em;text-transform:uppercase">Watch list</span>'
    : (r.section==='short' ? '<span class="chip" style="color:#fff;background:linear-gradient(180deg,#D44444,#A12222);letter-spacing:.08em;text-transform:uppercase">-2000+</span>' : '');
  const lg = r.status==='logged' ? `<span class="chip" style="color:#C7CEDC;background:#1A2236;border:1px solid #2E3B5C" title="Price logged ${esc(r.logged_label)}">Logged ${ml(r.logged_ml)}${r.late?' · late':''}</span>`
    : '<span class="chip" style="color:#9AA4BA;background:#121A2C;border:1px solid #26314B" title="The price is logged 5-8 hours (ITF 10-13) before Kalshi's listed time">Not logged yet</span>';
  return `<button type="button" class="card card-in" style="animation-delay:${delay}ms" onclick="location.hash='e-${esc(r.event)}'">
    <div class="row between" style="align-items:flex-start"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="tip">${esc(r.start_pt)}</span>
      <span style="font-size:12px;color:var(--muted)">${esc(r.tour)} · ${esc(tname(r))}${r.round?' · '+esc(r.round):''}${r.surface?' · '+esc(r.surface):''}</span></div>
      <div class="row" style="gap:6px;flex-wrap:wrap;justify-content:flex-end">${chip}${lg}</div></div>
    <div class="row" style="gap:14px"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">${playerLine(r,r.fav,true)}${playerLine(r,r.opp,false)}</div>${donut(r,104,delay)}</div>
    <div class="qual" style="color:${q[0]}"><svg viewBox="0 0 16 16" width="14" height="14" style="flex:none;margin-top:2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><path d="${q[1]}"/></svg><span>${esc(q[2])}</span></div>
    ${(r.flags||[]).map(w=>`<div class="warn">${esc(w)}</div>`).join('')}
    ${metricGrid(r, 360+delay)}
    <div class="more">Full breakdown <svg viewBox="0 0 16 16" width="13" height="13" style="fill:none;stroke:currentColor;stroke-width:2" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></div></button>`;
}
function tabsBar(){
  return `<div class="tabs" style="margin:14px 0 6px">${Object.entries(DATA.tabs).map(([k,l])=>`<a href="#${k}" class="${TAB===k?'on':''}" onclick="event.preventDefault();location.hash='${k}'">${esc(l)} <span style="font-size:11px;opacity:.75">${DATA.cards.filter(c=>c.tab===k).length}</span></a>`).join('')}</div>`;
}
function listView(){
  const cards = DATA.cards.filter(c=>c.tab===TAB), st = DATA.stats[TAB]||{};
  const mx = DATA.max[TAB], [g,y] = DATA.bands[TAB];
  let h = `<header class="row between" style="flex-wrap:wrap;align-items:flex-end;gap:16px"><div><div class="eyebrow">Tennis · Kalshi favorites -800 or shorter · tracking only</div><h1 class="title cond">Tennis</h1></div>
    <div style="text-align:right;font-size:13px;color:var(--muted);line-height:1.6">Updated ${esc(DATA.built_label)} · Elo ${esc(DATA.elo_updated.m||'–')} (men) / ${esc(DATA.elo_updated.w||'–')} (women)<br>Tracked so far: ${st.won||0}-${st.lost||0}${st.win!=null?` · ${st.win}% won vs ${st.implied}% priced`:''}${st.open?` · ${st.open} open`:''}</div></header>`;
  h += tabsBar();
  h += `<div class="legend"><span><i class="sw" style="background:var(--green)"></i>Favorite Elo top ${TOP} / weak opponent (${MID+1}+)</span><span><i class="sw" style="background:var(--yellow)"></i>Elo ${TOP+1}-${MID}</span>
    <span><i class="sw" style="background:var(--red)"></i>Favorite ${MID+1}+ / strong opponent (top ${TOP})</span><span>Hero ${mx===20?'0-20: Elo edge, serve + return, form, fatigue':'0-10: Elo edge + form'} · ring green ${g}+, yellow ${y}-${g-1}</span></div>`;
  let i = 0;
  [['Qualified','qualified','#2FC373','','-1000 to -2000 and Elo top '+TOP+' vs '+(MID+1)+'+'],
   ['Watch list','watch','#E9B23A','#FFD66B','-800 to -1000, or -1000 to -2000 without the rank match'],
   ['Shorter than -2000','short','#E04848','#FF7676','Tracked for the record']].forEach(([t,key,dot,col,sub])=>{
    const list = cards.filter(c=>c.section===key);
    h += `<section><div class="sec-head"><span style="width:10px;height:10px;border-radius:50%;background:${dot};box-shadow:0 0 10px ${dot}"></span>
      <h2 class="cond" style="color:${col||'#E6EAF2'}">${t}</h2><span class="cnt">${list.length}</span><div class="rule"></div><span style="font-size:12px;color:var(--dim)">${esc(sub)}</span></div>
      ${key==='short'?'<div class="redline grow"></div>':''}${key==='watch'?'<div class="amberline grow"></div>':''}
      <div class="grid">${list.map(c=>card(c,i++)).join('') || '<div style="color:var(--muted);font-size:14px">None right now.</div>'}</div></section>`;
  });
  const rec = DATA.recent.filter(r=>r.tab===TAB);
  h += `<section><div class="sec-head"><h2 class="cond">Recent results</h2><span class="cnt">${rec.length}</span><div class="rule"></div><span style="font-size:12px;color:var(--dim)">last 48 hours · <a href="results.html">all results</a></span></div>
    <div class="panel" style="padding:6px 16px 10px;margin-bottom:26px">${rec.map(r=>`<div class="tbl-row" style="grid-template-columns:auto minmax(0,1fr) auto auto">
      <span class="wl" title="${esc(r.void_reason||'')}" style="${r.status==='won'?FORM.g:(r.status==='lost'?FORM.r:'background:#1C2438;color:#8B95AB')}">${r.status==='won'?'W':(r.status==='lost'?'L':'V')}</span>
      <span style="min-width:0">${esc(r.fav.name)} <span style="color:var(--dim)">vs ${esc(r.opp.name)} · ${esc(tname(r))}</span></span>
      <span class="cond" style="font-weight:700">${ml(r.ml)}</span><span style="font-size:12px;color:var(--dim)">${r.score}/${r.max}</span></div>`).join('') || '<div style="color:var(--muted);font-size:14px;padding:10px 0">Nothing graded in the last 48 hours.</div>'}</div></section>`;
  h += `<p style="font-size:12px;color:var(--dim);line-height:1.6">Sources: prices and results from Kalshi (read-only) · Elo, serve/return and recent matches from Tennis Abstract · previews from Last Word On Tennis. Each match's price is logged once, 5-8 hours (ITF 10-13 hours) before Kalshi's listed time, which usually runs after the real start (ITF times shown are estimates, about 4.5 hours earlier than Kalshi lists). A match that settles within 45 minutes of its log is graded void (the price was taken mid-match). Tracking only, not betting advice.</p>`;
  return h;
}
function detailView(r){
  const b = BAND[r.band], q = qualLine(r);
  let h = `<div class="row" style="flex-wrap:wrap;margin-bottom:18px"><button class="btn" onclick="location.hash='${r.tab}'"><svg viewBox="0 0 16 16" width="14" height="14" style="fill:none;stroke:currentColor;stroke-width:2" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>All matches</button>
    <span style="font-size:13px;color:var(--muted)">${esc(r.start_pt)} · ${esc(r.tour)} · ${esc(tname(r))}${r.round?' · '+esc(r.round):''}</span></div>
    <h1 class="title cond" style="font-size:38px">${esc(r.fav.name)} <span style="color:#7C869E">vs</span> ${esc(r.opp.name)}</h1>
    <div style="margin:8px 0 20px;font-size:14px;color:#9AA4BA">Kalshi: ${esc(r.fav.name)} ${ml(r.ml)} (${cents(r.price)}) · ${esc(r.opp.name)} ${ml(r.opp_ml)}${r.logged_ml!=null?` · logged ${ml(r.logged_ml)} on ${esc(r.logged_label)}`:' · not logged yet'}</div>
    <div class="banner fade" style="align-items:center;border:1px solid ${q[0]}55;background:rgba(20,28,46,.6)"><span style="font-size:14px;color:${q[0]}">${esc(q[2])}</span></div>`;
  (r.flags||[]).forEach(w=>{ h += `<div class="warn" style="margin-bottom:10px">${esc(w)}</div>`; });
  (r.notes||[]).forEach(w=>{ h += `<div style="font-size:13px;color:#9AA4BA;margin:0 0 10px 4px">${esc(w)}</div>`; });
  h += `<div class="two" style="margin-top:10px"><div class="panel pad" style="flex:1 1 220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">${donut(r,170,0)}<span style="font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:${b.num}">${b.word}</span></div>
    <div class="panel pad" style="flex:999 1 340px;min-width:0"><h3>Score breakdown</h3><p class="note">${r.max===20?'Four metrics, 5 points each':'ITF: Elo edge + form, 5 points each'}</p>
    ${(r.metrics||[]).map(m=>`<div class="tbl-row" style="grid-template-columns:130px minmax(0,1fr) auto"><b>${esc(m.label)}</b><span style="color:#C7CEDC">${esc(m.note)}</span><span class="yn ${ptsCls(m.pts,m.max)}" style="font-size:13px">${m.pts}/${m.max}</span></div>`).join('')}</div></div>`;
  const ev = (lbl, list) => list && list.length ? `<div><b style="font-size:13px">${esc(lbl)}</b><div style="font-size:13px;color:#C7CEDC;margin-top:4px">${list.map(esc).join('<br>')}</div></div>` : '';
  h += `<div class="cols2"><div class="panel pad"><h3>Players</h3>
    ${[[r.fav,'Favorite',true],[r.opp,'Opponent',false]].map(([p,l,f])=>`<div class="tbl-row" style="grid-template-columns:90px minmax(0,1fr)"><span style="color:var(--muted)">${l}</span><span>${esc(p.name)} · Elo ${rankPill(p.elo_rank,f)}${p.elo?` (${Math.round(p.elo)})`:''} · rank ${p.rank?'#'+p.rank:'–'} · serve+return ${p.sr!=null?Number(p.sr).toFixed(1):'–'} · form ${formPill(p.form,f)}</span></div>`).join('')}
    <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:12px">${ev('Favorite: last two events', r.fav_form_events)}${ev('Opponent: last two events', r.opp_form_events)}</div></div>
    <div class="panel pad"><h3>Analyst readout</h3><p style="font-size:14px;color:#D3D9E5;line-height:1.6;margin:0 0 12px">${esc(r.readout||'')}</p>
    <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">${r.links.preview?`<a href="${esc(r.links.preview)}" target="_blank" rel="noopener">Last Word On Tennis preview ›</a>`:'<span style="color:var(--dim)">No Last Word On Tennis preview found for this match</span>'}
    <a href="${esc(r.links.search)}" target="_blank" rel="noopener">Search previews (Predict.Tennis, Sportsgambler, others) ›</a>
    ${r.links.fav_ta?`<a href="${esc(r.links.fav_ta)}" target="_blank" rel="noopener">${esc(r.fav.name)} on Tennis Abstract ›</a>`:''}${r.links.opp_ta?`<a href="${esc(r.links.opp_ta)}" target="_blank" rel="noopener">${esc(r.opp.name)} on Tennis Abstract ›</a>`:''}</div></div></div>`;
  return h;
}
function render(){
  const hsh = decodeURIComponent(location.hash.slice(1));
  if(hsh.startsWith('e-')){
    const r = DATA.cards.find(c=>c.event===hsh.slice(2)) || DATA.recent.find(c=>c.event===hsh.slice(2));
    if(r){ app.innerHTML = detailView(r); window.scrollTo(0,0); return; }
  }
  if(hsh==='itf' || hsh==='main') TAB = hsh;
  app.innerHTML = listView();
}
window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
</html>
